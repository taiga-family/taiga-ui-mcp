name: ⚙️ Build
on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiga-family/ci/setup-variables@5dc7b6f26e61c065c886a16767862da3b9e4f329 # v2.23.0
      - uses: taiga-family/ci/setup-node@5dc7b6f26e61c065c886a16767862da3b9e4f329 # v2.23.0
        with:
          node-version: 26.x
      - run: npm run build

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiga-family/ci/setup-variables@5dc7b6f26e61c065c886a16767862da3b9e4f329 # v2.23.0
      - uses: taiga-family/ci/setup-node@5dc7b6f26e61c065c886a16767862da3b9e4f329 # v2.23.0
        with:
          node-version: 26.x
      - run: npm test

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
