name: ⚙️ Build
on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiga-family/ci/setup-variables@ad2e311a6700d8fc7efab79f8b8a2165888ff968 # v2.20.0
      - uses: taiga-family/ci/setup-node@ad2e311a6700d8fc7efab79f8b8a2165888ff968 # v2.20.0
        with:
          node-version: 26.x
      - run: npm run build

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiga-family/ci/setup-variables@ad2e311a6700d8fc7efab79f8b8a2165888ff968 # v2.20.0
      - uses: taiga-family/ci/setup-node@ad2e311a6700d8fc7efab79f8b8a2165888ff968 # v2.20.0
        with:
          node-version: 26.x
      - run: npm test

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
