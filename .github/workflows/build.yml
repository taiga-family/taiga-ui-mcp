name: ⚙️ Build
on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiga-family/ci/actions/setup/variables@e562b599e17d4643a4f4252bc597af76a2e3e7d9 # v2.15.0
      - uses: taiga-family/ci/actions/setup/node@e562b599e17d4643a4f4252bc597af76a2e3e7d9 # v2.15.0
      - run: npm run build

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiga-family/ci/actions/setup/variables@e562b599e17d4643a4f4252bc597af76a2e3e7d9 # v2.15.0
      - uses: taiga-family/ci/actions/setup/node@e562b599e17d4643a4f4252bc597af76a2e3e7d9 # v2.15.0
      - run: npm test

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
