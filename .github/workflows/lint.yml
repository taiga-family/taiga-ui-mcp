name: Lint
on: [pull_request]

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiga-family/ci/setup-variables@e562b599e17d4643a4f4252bc597af76a2e3e7d9 # v2.15.0
      - uses: taiga-family/ci/setup-node@e562b599e17d4643a4f4252bc597af76a2e3e7d9 # v2.15.0
        with:
          node-version: 26.x
      - run: npm run typecheck

  cspell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiga-family/ci/setup-variables@e562b599e17d4643a4f4252bc597af76a2e3e7d9 # v2.15.0
      - uses: taiga-family/ci/setup-node@e562b599e17d4643a4f4252bc597af76a2e3e7d9 # v2.15.0
        with:
          node-version: 26.x
      - run: npm run cspell -- --no-progress

  prettier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiga-family/ci/setup-variables@e562b599e17d4643a4f4252bc597af76a2e3e7d9 # v2.15.0
      - uses: taiga-family/ci/setup-node@e562b599e17d4643a4f4252bc597af76a2e3e7d9 # v2.15.0
        with:
          node-version: 26.x
      - run: npm run prettier ${{ env.SUPPORT_AUTO_PUSH == 'true' && '-- --write' || '-- --check' }}
      - uses: taiga-family/ci/auto-push@e562b599e17d4643a4f4252bc597af76a2e3e7d9 # v2.15.0
        with:
          token: ${{ secrets.TAIGA_FAMILY_BOT_PAT }}

  eslint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiga-family/ci/setup-variables@e562b599e17d4643a4f4252bc597af76a2e3e7d9 # v2.15.0
      - uses: taiga-family/ci/setup-node@e562b599e17d4643a4f4252bc597af76a2e3e7d9 # v2.15.0
        with:
          node-version: 26.x
      - run: npm run lint ${{ env.SUPPORT_AUTO_PUSH == 'true' && '-- --fix' || '' }}
      - uses: taiga-family/ci/auto-push@e562b599e17d4643a4f4252bc597af76a2e3e7d9 # v2.15.0
        with:
          token: ${{ secrets.TAIGA_FAMILY_BOT_PAT }}

  result:
    needs: [typecheck, cspell, prettier, eslint]
    runs-on: ubuntu-latest
    name: Lint result
    steps:
      - run: echo "Success"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
